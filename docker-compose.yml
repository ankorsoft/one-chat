version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: onechat-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-onechat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-onechat_secret}
      POSTGRES_DB: ${POSTGRES_DB:-onechat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-onechat} -d ${POSTGRES_DB:-onechat}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onechat-network

  # Redis Cache & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: onechat-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onechat-network

  # MinIO S3-compatible Storage
  minio:
    image: minio/minio:latest
    container_name: onechat-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onechat-network

  # ClamAV Antivirus
  clamav:
    image: clamav/clamav:latest
    container_name: onechat-clamav
    volumes:
      - clamav_data:/var/lib/clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=3310"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - onechat-network

  # FastAPI Backend
  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi/Dockerfile
    container_name: onechat-fastapi
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onechat}:${POSTGRES_PASSWORD:-onechat_secret}@postgres:5432/${POSTGRES_DB:-onechat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onechat-network

  # ARQ Workers
  worker:
    build:
      context: .
      dockerfile: docker/workers/Dockerfile
    container_name: onechat-worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-onechat}:${POSTGRES_PASSWORD:-onechat_secret}@postgres:5432/${POSTGRES_DB:-onechat}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin_secret}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    networks:
      - onechat-network

  # Next.js Frontend
  nextjs:
    build:
      context: ./frontend
      dockerfile: ../docker/nextjs/Dockerfile
    container_name: onechat-nextjs
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000/ws
    depends_on:
      - fastapi
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - onechat-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:

networks:
  onechat-network:
    driver: bridge
